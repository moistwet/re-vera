[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "re-vera-backend"
version = "0.1.0"
description = "Re-Vera backend — FastAPI service that checks the factual claims in a news article."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # The `lua` extra pulls lupa, which is what lets fakeredis run EVAL/EVALSHA.
    # app/events.py publishes through a Lua script, so without it every call in
    # the event core fails with `unknown command 'evalsha'` and the suite is red
    # on a fresh checkout. Not optional — it is a test-time dependency of the
    # code under test.
    "fakeredis[lua]>=2.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "datamodel-code-generator>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Generated by shared/generate.sh — never hand-edited, so never hand-fixed either.
"app/schema_models.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
# `redis` and `fakeredis` both ship py.typed at the versions pinned above, so no
# `ignore_missing_imports` override is needed. Add one here if that ever changes.

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
